name: Build iOS IPA (Virtual Mac)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required for some tooling)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Archive (Unsigned)
        run: flutter build ipa --no-codesign

      - name: Package .ipa for Sideloading (AltStore / Sideloadly)
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa_payload/Payload/
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          fi
          cd build/ios/ipa_payload
          zip -r TasteMatch.ipa Payload
          mv TasteMatch.ipa ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TasteMatch-iOS-IPA
          path: TasteMatch.ipa
          retention-days: 14
