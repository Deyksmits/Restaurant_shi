name: Build iOS IPA (Virtual Mac)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required for some tooling)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Flutter iOS Project (Unsigned)
        run: flutter build ios --config-only --release --no-codesign

      - name: Compile Unsigned iOS App via Xcode
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package .ipa for Sideloading (AltStore / Sideloadly)
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found in build directory!"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -qry TasteMatch.ipa Payload
          ls -lh TasteMatch.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TasteMatch-iOS-IPA
          path: TasteMatch.ipa
          retention-days: 14
